name: Build and push

on:
  schedule:
    - cron: "37 * * * *" # poll upstream for new releases every hour
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.20.9). Leave blank to build the latest upstream release. Manual runs always build."
        required: false
        default: ""
        type: string

# Least privilege by default; only the "record" job gets write access.
permissions:
  contents: read

# Never run two builds at once (avoids racing on tags and the state file).
concurrency:
  group: build-and-push
  cancel-in-progress: false

env:
  # EDIT THESE if you are running this under your own account
  DOCKERHUB_USER: "pinheadtf2"
  IMAGE: "pinheadtf2/copypinny"
  GHCR_IMAGE: "ghcr.io/pinheadtf2/copypinny"
  UPSTREAM_REPO: "9001/copyparty"
  STATE_FILE: ".github/last_upstream_release.txt"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      latest_version: ${{ steps.check.outputs.latest_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decide whether to build
        id: check
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current="$(cat "$STATE_FILE" 2>/dev/null || true)"
          latest=""

          # Look up the latest upstream release (may fail; handled below)
          if raw_tag="$(curl --silent --show-error --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
              | jq -r '.tag_name // empty')"; then
            latest="${raw_tag#v}"
          fi

          should_build=false
          version=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs ALWAYS build, regardless of the recorded version.
            version="${VERSION_OVERRIDE#v}"
            version="${version:-$latest}"
            if [ -z "$version" ]; then
              echo "::error::No version given and the latest upstream release could not be determined."
              exit 1
            fi
            should_build=true
          elif [ -z "$latest" ]; then
            echo "::warning::Could not fetch the latest upstream release; skipping this run."
          elif [ "$latest" != "$current" ] \
               && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" = "$latest" ]; then
            # Scheduled run and upstream has something newer than what we last built
            version="$latest"
            should_build=true
          fi

          {
            echo "should_build=$should_build"
            echo "version=$version"
            echo "latest_version=$latest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build decision"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$GITHUB_EVENT_NAME\` |"
            echo "| Should build | \`$should_build\` |"
            echo "| Last built | \`${current:-none}\` |"
            echo "| Latest upstream | \`${latest:-unknown}\` |"
            echo "| Version to build | \`${version:-none}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # emulated multi-arch builds can be slow
    permissions:
      contents: read
      packages: write # needed to push to GHCR

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ac
            platforms: linux/amd64,linux/arm/v7,linux/s390x,linux/386,linux/arm64/v8,linux/ppc64le
          - variant: iv
            platforms: linux/amd64,linux/386,linux/arm64/v8
          - variant: dj
            platforms: linux/amd64,linux/386,linux/arm64/v8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.check.outputs.version }}
          LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
        run: |
          set -euo pipefail

          tags="${IMAGE}:${VARIANT}-${VERSION}"

          # Only move the "latest" tags when building the current upstream release
          if [ "$VERSION" = "$LATEST_VERSION" ]; then
            tags+=$'\n'"${IMAGE}:${VARIANT}-latest"

            # "ac" is the default/recommended variant, so it also owns plain "latest"
            if [ "$VARIANT" = "ac" ]; then
              tags+=$'\n'"${IMAGE}:latest"
            fi
          fi

          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            IMAGE_TAG=${{ needs.check.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # Separate cache per variant so the matrix jobs don't overwrite each other
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

  record:
    needs: [check, build]
    # Record only after a successful build of the current upstream release.
    # (Manually building an old version won't rewind the state file.)
    if: >-
      needs.build.result == 'success' &&
      needs.check.outputs.version == needs.check.outputs.latest_version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record built upstream release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          printf '%s\n' "$VERSION" > "$STATE_FILE"

          git add "$STATE_FILE"
          if git diff --cached --quiet; then
            echo "State file already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: built Copyparty ${VERSION}"
          git push
